[project]
name = "devlopment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Priya yadav", email = "py612882@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.16.5",
    "langchain>=0.3.30",
    "langchain-community>=0.3.31",
    "langgraph>=0.6.11",
    "mypy>=1.19.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.11.0",
    "pytest>=8.4.2",
    "ruff>=0.16.4",
    "sqlalchemy>=2.0.52",
    "structlog>=25.5.0",
]

[project.scripts]
devlopment = "devlopment:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
